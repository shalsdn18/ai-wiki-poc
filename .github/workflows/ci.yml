name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt black ruff

      - name: Ruff
        run: ruff check app.py engine/cache.py engine/news_agent.py engine/pipeline.py engine/vector_store.py engine/watcher.py mcp_server tests/test_api.py tests/test_cache.py tests/test_mcp_server.py tests/test_news_agent.py tests/test_pipeline.py tests/test_vector_store.py tests/test_watcher.py --ignore F401,BLE001

      - name: Black
        run: black --check app.py engine/cache.py engine/news_agent.py engine/pipeline.py engine/vector_store.py engine/watcher.py mcp_server tests/test_api.py tests/test_cache.py tests/test_mcp_server.py tests/test_news_agent.py tests/test_pipeline.py tests/test_vector_store.py tests/test_watcher.py

      - name: Pytest
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Docker build
        run: docker compose build

      - name: Check diff whitespace
        run: git diff --check
