services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      WIKI_ROOT: /app/wiki
      OBSIDIAN_IMPORT_STATE_PATH: /app/state/.obsidian_import_state.json
      OLLAMA_BASE_URL: http://ollama:11434
      VECTOR_DB_PATH: /app/cache/vectors.db
      ENABLE_LOCAL_IMPORT: "true"
      ENABLE_LOCAL_RAG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./wiki:/app/wiki
      - ./cache:/app/cache
      - ./state:/app/state
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
